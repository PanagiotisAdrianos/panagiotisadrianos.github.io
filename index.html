<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocketfold</title>
<meta name="description" content="Κατέγραψε τα καθημερινά σου έξοδα και δες πού πάνε τα χρήματά σου κάθε μήνα.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocketfold">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Layout: one narrow column, month summary first, then the add form, then the day-by-day list */
:root{
  --bg:#eef1f6;--surface:#ffffff;--ink:#111a2e;--muted:#5b6475;--line:#d7dce6;
  --accent:#1f3a68;--accent-ink:#ffffff;--soft:#e4e9f2;--danger:#b3261e;--warn:#a86400;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1220;--surface:#161d2e;--ink:#e6eaf2;--muted:#95a0b5;--line:#273149;
    --accent:#8fb0ea;--accent-ink:#0b1426;--soft:#1c2539;--danger:#ff8a80;--warn:#f0b04a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1220;--surface:#161d2e;--ink:#e6eaf2;--muted:#95a0b5;--line:#273149;
  --accent:#8fb0ea;--accent-ink:#0b1426;--soft:#1c2539;--danger:#ff8a80;--warn:#f0b04a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
#root{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.01em;font-size:1.05rem}
.status{font-size:.8rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav h1{font-size:1rem;font-weight:600;margin:0;color:var(--muted);text-wrap:balance}
.icon{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:1.3rem;cursor:pointer}
.icon:disabled{opacity:.35;cursor:default}
.total{display:flex;flex-direction:column;align-items:flex-start;margin:14px 0 6px}
.lbl{font-size:.85rem;color:var(--muted)}
.big{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.sub{font-size:.85rem;color:var(--muted)}
.budget{margin:12px 0 4px;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>span{background:var(--warn)}
.bar.over>span{background:var(--danger)}
.bline{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.bline strong{color:var(--ink);font-variant-numeric:tabular-nums}
.bline .neg{color:var(--danger)}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.bedit{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bedit input{flex:1;min-width:120px}
.small{padding:9px 14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin-top:16px;background:var(--soft)}
.stack span{display:block;min-width:4px}
.cats{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.cats:empty{display:none}
.cats li{display:grid;grid-template-columns:10px 1fr auto 3.2em;gap:10px;align-items:center;font-size:.92rem}
.cats i,.dot{width:10px;height:10px;border-radius:3px;display:block}
.cats b{font-weight:600;font-variant-numeric:tabular-nums}
.cats em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-size:.85rem}
h2{font-size:1.05rem;margin:0 0 12px}
form{display:flex;flex-direction:column;gap:14px}
.amtrow{display:flex;align-items:center;border-bottom:2px solid var(--line)}
.amtrow:focus-within{border-color:var(--accent)}
#amt{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:2rem;font-weight:700;padding:4px 0;outline:none;font-variant-numeric:tabular-nums;min-width:0}
.eur{font-size:1.6rem;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-checked="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
#note,#date,#bud{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.primary{padding:13px 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
.err{margin:0;color:var(--danger);font-size:.88rem}
.err:empty{display:none}
.exbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:.88rem}
.exbar:empty{display:none}
.dayh{display:flex;justify-content:space-between;padding:14px 4px 6px;font-size:.82rem;color:var(--muted);font-weight:600}
.dayh span:last-child{font-variant-numeric:tabular-nums}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:10px 1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{display:flex;flex-direction:column;min-width:0}
.item .t span{font-weight:600}
.item .t small{color:var(--muted);overflow-wrap:anywhere}
.tag{font-size:.7rem;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--muted);margin-left:6px;font-weight:500}
.amount{font-weight:700;font-variant-numeric:tabular-nums}
.del{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.8rem;cursor:pointer;padding:6px 8px;border-radius:8px}
.del.sure{background:var(--danger);color:var(--surface)}
.recent{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin:-4px 0 0}
.recent:empty{display:none}
.rchip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:10px;border:1px dashed var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
.rchip b{font-weight:700;font-variant-numeric:tabular-nums}
.formfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.formfoot .primary{flex:1}
.item .t{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.editing{outline:2px solid var(--accent);outline-offset:-2px}
.tools{display:flex;justify-content:center;padding-top:12px}
.privacy{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
.none{text-align:center;color:var(--muted);padding:24px 8px;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hint{margin:0 0 12px;font-size:.88rem;color:var(--muted)}
.hint.nudge{color:var(--warn);font-weight:600}
.bkbtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ghost{display:inline-block;margin:0;padding:9px 14px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:1rem;font-weight:600;cursor:pointer}
.ghost:focus-within,#importFile:focus-visible + .ghost{outline:2px solid var(--accent);outline-offset:2px}
.installbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:.9rem;order:-1}
.installbar[hidden]{display:none}
.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ptile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-width:0}
.ptile span{font-size:.75rem;color:var(--muted);line-height:1.25}
.ptile b{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ptile:first-child{background:var(--accent);border-color:var(--accent)}
.ptile:first-child span,.ptile:first-child b{color:var(--accent-ink)}
.topright{display:flex;align-items:center;gap:10px}
.langsw{min-width:44px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:.8rem;font-weight:700;letter-spacing:.04em;cursor:pointer}
.langpick{margin-top:12vh;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:32px 20px}
.langpick h1{margin:8px 0 0;font-size:1.6rem;letter-spacing:-.01em}
.langpick p{margin:4px 0 14px;color:var(--muted)}
.lp-icon{width:72px;height:72px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:2.4rem;font-weight:800}
.lp-btns{display:grid;gap:10px;width:100%;max-width:280px}
.lp-btns button{width:100%}
.ghostbtn{padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.lp-note{font-size:.8rem;margin-top:14px!important}
</style>
</head>
<body>
<div id="root"></div>
<script src="./app.js"></script>
</body>
</html>
