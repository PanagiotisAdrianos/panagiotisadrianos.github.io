<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ημερολόγιο προπόνησης</title>
<meta name="description" content="Κατέγραψε κιλά και επαναλήψεις σε κάθε άσκηση και δες την πρόοδό σου.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#E8ECEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Γυμναστήριο">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Fira Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-c:'Fira Sans Condensed','Roboto Condensed','Arial Narrow','Fira Sans',system-ui,sans-serif;
  --bg:#E8ECEE; --surface:#FFFFFF; --surface-2:#F0F3F4; --ink:#141C22; --muted:#56646F; --line:#D2D9DE;
  --accent:#F5C400; --accent-press:#DDB000; --on-accent:#141C22;
  --focus:#1747C7; --danger:#B8321F; --flash:#FFEFA8;
  --toast-bg:#141C22; --toast-fg:#F3F6F7; --toast-act:#F5C400;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181B; --surface:#1E2327; --surface-2:#272D32; --ink:#ECF0F2; --muted:#9BA7B0; --line:#343C42;
    --focus:#8FB0FF; --danger:#FF8272; --flash:#4A3F10;
    --toast-bg:#ECF0F2; --toast-fg:#14181B; --toast-act:#6E5000;
  }
}
:root[data-theme="dark"]{
  --bg:#14181B; --surface:#1E2327; --surface-2:#272D32; --ink:#ECF0F2; --muted:#9BA7B0; --line:#343C42;
  --focus:#8FB0FF; --danger:#FF8272; --flash:#4A3F10;
  --toast-bg:#ECF0F2; --toast-fg:#14181B; --toast-act:#6E5000;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
h1,h2,h3,p,ol,ul{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:560px;margin:0 auto}
main{padding:calc(18px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom));outline:none}
.muted{color:var(--muted);font-size:14px}

/* library */
.top h1{font:700 31px/1.1 var(--font-c);letter-spacing:.005em}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sub{color:var(--muted);margin-top:6px;font-size:15px}
.note{margin-top:6px;font-size:14px;color:var(--muted)}
.finder{position:sticky;top:0;z-index:5;background:var(--bg);margin:10px -16px 0;padding:10px 16px 6px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:50px;color:var(--muted)}
.search:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none;height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:10px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--gc);flex:none}
.gh{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.gh h2{font:600 20px/1.2 var(--font-c)}
.gh .cnt{margin-left:auto;color:var(--muted);font-size:14px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 14px 10px 18px;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);box-shadow:inset 5px 0 0 var(--gc)}
.ex:first-child{border-top:0}
.ex:active{background:var(--surface-2)}
.ex-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ex-name{font-weight:500;font-size:16px;line-height:1.25}
.ex-en{color:var(--muted);font-size:13px;line-height:1.3}
.ex-last{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.ex-last b{font:600 19px/1 var(--font-c);font-variant-numeric:tabular-nums}
.ex-last span{font-size:12px;color:var(--muted)}
.ex-last .tag-today{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 9px;font-weight:600}
.badge-done{flex:none;align-self:center;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.done-btn{margin-top:16px}
.done-btn.done{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.none{margin-top:26px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.none p{color:var(--muted)}
.secondary,.primary-sm,.text-btn{border-radius:14px;min-height:48px;padding:0 18px;font-weight:500}
.secondary{border:1px solid var(--line);background:var(--surface)}
.secondary.wide{width:100%;margin-top:18px}
.primary-sm{border:0;background:var(--accent);color:var(--on-accent);font-weight:600}
.text-btn{border:0;background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:0 4px}
.addbar{margin-top:26px}
.addbar .secondary{width:100%}

/* history */
.day{margin-top:24px}
.dayh h2{font:600 21px/1.2 var(--font-c)}
.dayh p{margin:2px 0 8px}
.backup{margin-top:32px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.backup h2{font:600 20px/1.2 var(--font-c)}
.backup p{margin:6px 0 12px;font-size:14px;color:var(--muted)}
.backup p.nudge{color:var(--danger);font-weight:500}
.bk-btns{display:flex;flex-wrap:wrap;gap:10px}
.bk-btns .secondary,.bk-btns label{flex:1 1 150px}
.bk-btns label{display:flex;align-items:center;justify-content:center;border-radius:14px;min-height:48px;padding:0 14px;font-weight:500;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#importFile:focus-visible + label{outline:3px solid var(--focus);outline-offset:2px}

/* exercise */
.xhead{display:flex;align-items:flex-start;gap:6px;margin:-6px 0 0 -10px}
.back{flex:none;width:48px;height:48px;border:0;background:transparent;border-radius:14px;display:grid;place-items:center}
.xtitle{padding-top:6px;outline:none}
.xtitle h1{font:700 29px/1.1 var(--font-c);outline:none}
.xtitle p{color:var(--muted);font-size:15px;margin-top:3px}
.gtag{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.gtag-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 14px}
.prev-time{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.prev-label{font-size:12px;color:var(--muted)}
.prev-sets{font:600 17px/1.3 var(--font-c);font-variant-numeric:tabular-nums}
.prev-time.prev-empty{color:var(--muted);font-size:14px;padding:12px 14px}
.yt-link{flex:none;display:flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:500;text-decoration:none}
.yt-link:active{background:var(--line)}
.logger{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{background:var(--surface-2);border-radius:16px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.step label{font-size:14px;color:var(--muted);font-weight:500}
.step input{width:100%;text-align:center;font:700 58px/1 var(--font-c);font-variant-numeric:tabular-nums;border:0;background:transparent;color:var(--ink);padding:4px 0 6px;border-radius:10px;min-width:0}
.step input[aria-invalid="true"]{box-shadow:inset 0 -4px 0 var(--danger)}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.pm button{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.pm button:active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hint{margin-top:10px;font-size:14px;color:var(--muted)}
.primary{width:100%;height:58px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font:600 18px var(--font);margin-top:14px}
.primary:active{background:var(--accent-press)}
.primary[disabled]{opacity:.55;cursor:default}
.err{color:var(--danger);font-size:14px;min-height:20px;margin-top:8px}
.block{margin-top:26px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.bh h2{font:600 21px/1.2 var(--font-c)}
.sets{list-style:none;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.set{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;min-height:58px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 16px var(--font-c)}
.set .v{flex:1;font-size:17px;color:var(--muted)}
.set .v b{font:700 27px/1 var(--font-c);font-variant-numeric:tabular-nums;color:var(--ink)}
.icon-btn{flex:none;width:46px;height:46px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--surface-2)}
.empty{color:var(--muted);font-size:15px;padding:2px 0}
.flash{animation:flash 1.3s ease-out}
@keyframes flash{from{background:var(--flash)}to{background:transparent}}
.stats{display:grid;grid-template-columns:1.4fr 1fr .8fr;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font:700 23px/1.15 var(--font-c);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.chart{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px}
.chart h3{font-size:14px;font-weight:500;color:var(--muted);margin-bottom:6px}
.chart svg{display:block;width:100%;height:auto}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-line{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-pt{fill:var(--accent);stroke:var(--ink);stroke-width:2}
.ch-txt{fill:var(--muted);font:12px var(--font)}
.hist{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 8px 12px 14px}
.hh{display:flex;align-items:center;gap:10px;min-height:40px}
.hh .date{font-weight:600}
.hh .del{margin-left:auto;min-height:40px;padding:0 8px;font-size:14px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding-right:6px}
.pill{background:var(--surface-2);border-radius:8px;padding:4px 10px;font:500 16px var(--font-c);font-variant-numeric:tabular-nums}
.danger-zone{margin-top:32px;display:flex;justify-content:center}
.danger-zone .text-btn{color:var(--danger)}

/* chrome */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr}
.tab{position:relative;height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:500;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:24%;right:24%;height:4px;border-radius:0 0 4px 4px;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:14px;max-width:min(92vw,520px);padding:12px 12px 12px 16px;border-radius:14px;background:var(--toast-bg);color:var(--toast-fg);font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.rest{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:15;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--toast-bg);color:var(--toast-fg);box-shadow:0 6px 24px rgba(0,0,0,.25);overflow:hidden;max-width:520px;margin:0 auto}
.rest[hidden]{display:none}
.rest-fill{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .25s linear}
.rest-main{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.15}
.rest-lbl{font-size:13px;opacity:.8}
.rest-time{font:700 28px/1.05 var(--font-c);font-variant-numeric:tabular-nums}
.rest-dur{font-size:12px;opacity:.7}
.rest-btns{display:flex;gap:6px}
.rest-btns button{min-width:48px;height:44px;border:0;border-radius:12px;background:rgba(127,127,127,.22);color:inherit;font-weight:700;font-size:15px}
.rest.rest-done{background:var(--accent);color:var(--on-accent)}
body.resting .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
body.resting main{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.toast button{border:0;background:transparent;color:var(--toast-act);font-weight:600;min-height:40px;padding:0 8px}
dialog{border:0;padding:0;border-radius:22px;background:var(--surface);color:var(--ink);width:min(92vw,420px)}
dialog::backdrop{background:rgba(8,12,16,.55)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font:700 25px/1.1 var(--font-c)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted);font-weight:500}
.field input,.field select{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 12px;font:inherit;font-size:16px;width:100%}
.check{display:flex;gap:12px;align-items:center;min-height:46px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--focus);flex:none}
.row{display:flex;gap:10px}
.row button{flex:1}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
@media (max-width:360px){.step input{font-size:50px}.stat b{font-size:20px}}
</style>
</head>
<body>
<div id="app"><main id="screen" tabindex="-1"></main></div>

<nav class="tabs" aria-label="Κύριο μενού"><div class="tabs-in">
  <button class="tab" data-tab="program">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9.5 17l1.5 1.5L15 15"/></svg>
    <span>Πρόγραμμα</span>
  </button>
  <button class="tab" data-tab="library">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>
    <span>Ασκήσεις</span>
  </button>
  <button class="tab" data-tab="history">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Ιστορικό</span>
  </button>
</div></nav>

<div class="rest" id="rest" role="timer" aria-live="off" hidden>
  <div class="rest-fill" id="restFill"></div>
  <div class="rest-main"><span class="rest-lbl" id="restLbl">Ανάπαυση</span><b class="rest-time" id="restTime">1:30</b><span class="rest-dur" id="restDur"></span></div>
  <div class="rest-btns"><button data-rest="-15" aria-label="15 δευτερόλεπτα λιγότερο">−15</button><button data-rest="15" aria-label="15 δευτερόλεπτα περισσότερο">+15</button><button data-rest="stop" aria-label="Κλείσιμο χρονομέτρου">✕</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button id="toastUndo" hidden>Αναίρεση</button></div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg">
    <h2 id="dlgTitle">Νέα άσκηση</h2>
    <div class="field"><label for="dlgName">Όνομα άσκησης</label><input id="dlgName" type="text" maxlength="60" autocomplete="off"></div>
    <div class="field"><label for="dlgGroup">Μυϊκή ομάδα</label><select id="dlgGroup"></select></div>
    <label class="check"><input id="dlgTime" type="checkbox"><span>Τη μετράω σε δευτερόλεπτα (π.χ. σανίδα)</span></label>
    <p class="err" id="dlgErr" role="alert"></p>
    <div class="row"><button class="secondary" id="dlgCancel">Ακύρωση</button><button class="primary-sm" id="dlgSave">Προσθήκη άσκησης</button></div>
  </div>
</dialog>

<script src="./app.js"></script>
</body>
</html>
